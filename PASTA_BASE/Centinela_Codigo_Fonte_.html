<script>
function toggleSidebar() {
  try {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.querySelector('.sidebar-overlay');
    const iframeContainer = document.querySelector('.module-iframe-container');

    if (!sidebar) {
      console.error('Sidebar element not found!');
      return;
    }
    if (!overlay) {
      console.error('Overlay element not found!');
      return;
    }

    const isOpening = !sidebar.classList.contains('active');

    sidebar.classList.toggle('active');
    overlay.classList.toggle('active');

    // Desabilitar interação com iframe quando sidebar está aberta
    if (iframeContainer) {
      iframeContainer.style.pointerEvents = isOpening ? 'none' : 'auto';
    }

    // Forçar repaint em mobile para garantir que a sidebar apareça
    sidebar.offsetHeight;

    console.log('Sidebar toggled, active:', sidebar.classList.contains('active'));
  } catch (e) {
    console.error('Error in toggleSidebar:', e);
  }
}

function toggleSidebarCollapse() {
  const sidebar = document.getElementById('sidebar');
  const body = document.body;
  const icon = document.getElementById('toggleIcon');
  
  sidebar.classList.toggle('collapsed');
  body.classList.toggle('sidebar-collapsed');
  
  // Salvar estado no localStorage
  const isCollapsed = sidebar.classList.contains('collapsed');
  localStorage.setItem('sidebarCollapsed', isCollapsed);
  
  // Mudar ícone
  icon.textContent = isCollapsed ? '⇨' : '⇦';
}

// Restaurar estado ao carregar e configurar event listeners
document.addEventListener('DOMContentLoaded', function() {
  // ============ Configurar Event Listeners (evita CSP blocking) ============
  const mobileMenuBtn = document.getElementById('mobileMenuBtn');
  const sidebarCollapseBtn = document.getElementById('sidebarCollapseBtn');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const scrollToTopBtn = document.getElementById('scrollToTopBtn');

  if (mobileMenuBtn) {
    mobileMenuBtn.addEventListener('click', toggleSidebar);
    mobileMenuBtn.addEventListener('touchend', function(e) {
      e.preventDefault();
      toggleSidebar();
    });
  }

  if (sidebarCollapseBtn) {
    sidebarCollapseBtn.addEventListener('click', toggleSidebarCollapse);
  }

  if (sidebarOverlay) {
    sidebarOverlay.addEventListener('click', toggleSidebar);
  }

  if (scrollToTopBtn) {
    scrollToTopBtn.addEventListener('click', scrollToTop);
  }

  // ============ Restaurar estado collapsed ============
  const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
  if (isCollapsed) {
    const sidebar = document.getElementById('sidebar');
    const body = document.body;
    const icon = document.getElementById('toggleIcon');

    sidebar.classList.add('collapsed');
    body.classList.add('sidebar-collapsed');
    icon.textContent = '⇨';
  }

  // ============ Controle Menu/Botão Scroll (Mobile) ============
  if (window.innerWidth <= 768) {
    const menuBtn = document.querySelector('.mobile-menu-btn');
    const scrollBtn = document.getElementById('scrollToTopBtn');
    let menuHidden = false;

    // Verificar se estamos em uma página com iframe
    const hasIframe = document.querySelector('.module-iframe-container') !== null;

    // Referência ao container do iframe (se existir)
    const iframeContainer = document.querySelector('.module-iframe-container');

    // Função para esconder menu e mostrar botão scroll
    function hideMenuShowScroll() {
      if (!menuHidden && menuBtn && scrollBtn) {
        menuBtn.classList.add('hidden');
        scrollBtn.classList.add('visible');
        if (iframeContainer) iframeContainer.classList.add('expanded');
        menuHidden = true;
      }
    }

    // Função para mostrar menu e esconder botão scroll
    function showMenuHideScroll() {
      if (menuHidden && menuBtn && scrollBtn) {
        menuBtn.classList.remove('hidden');
        scrollBtn.classList.remove('visible');
        if (iframeContainer) iframeContainer.classList.remove('expanded');
        menuHidden = false;
      }
    }

    // ============ PARA IFRAMES: Comunicação via postMessage ============
    if (hasIframe) {
      // Listener para mensagens vindas do iframe
      window.addEventListener('message', function(event) {
        // Verificar se é a mensagem de scroll do módulo
        if (event.data && event.data.type === 'PORTAL_SCROLL_UPDATE') {
          if (event.data.isScrolled === true) {
            hideMenuShowScroll();
          } else if (event.data.isScrolled === false) {
            showMenuHideScroll();
          }
        }
      });
    }
    // ============ PARA PÁGINAS SEM IFRAME: Scroll detection normal ============
    else {
      // Detectar container de scroll
      const scrollContainer = document.querySelector('.main-content') ||
                              document.querySelector('.content-body') ||
                              document.body;

      // Função para controlar visibilidade baseado no scroll
      function handleScroll() {
        const currentScroll = (scrollContainer === window || scrollContainer === document.body)
          ? window.scrollY || document.documentElement.scrollTop
          : scrollContainer.scrollTop;

        if (currentScroll > 100) {
          hideMenuShowScroll();
        } else {
          showMenuHideScroll();
        }
      }

      // Adicionar listener no container de scroll
      if (scrollContainer && scrollContainer !== document.body) {
        scrollContainer.addEventListener('scroll', handleScroll, { passive: true });
      }

      // Também no window
      window.addEventListener('scroll', handleScroll, { passive: true });

      // Guardar referência para scrollToTop
      window._portalScrollContainer = scrollContainer;
    }

    // Guardar funções globais
    window._portalMenuHidden = function() { return menuHidden; };
    window._portalSetMenuHidden = function(val) { menuHidden = val; };
    window._portalShowMenu = showMenuHideScroll;
    window._portalHideMenu = hideMenuShowScroll;
  }
});

// Função para voltar ao topo
function scrollToTop() {
  const menuBtn = document.querySelector('.mobile-menu-btn');
  const scrollBtn = document.getElementById('scrollToTopBtn');

  // Mostrar menu e esconder botão (de forma robusta)
  if (menuBtn) menuBtn.classList.remove('hidden');
  if (scrollBtn) scrollBtn.classList.remove('visible');

  // Remover classe expanded do iframe container
  const iframeContainer = document.querySelector('.module-iframe-container');
  if (iframeContainer) iframeContainer.classList.remove('expanded');

  // Atualizar estado via função global
  if (window._portalShowMenu) {
    window._portalShowMenu();
  } else if (window._portalSetMenuHidden) {
    window._portalSetMenuHidden(false);
  }

  // Rolar o container correto (para páginas sem iframe)
  const scrollContainer = window._portalScrollContainer || document.body;
  if (scrollContainer && scrollContainer !== document.body && scrollContainer !== window) {
    scrollContainer.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Sempre tentar rolar window também
  window.scrollTo({ top: 0, behavior: 'smooth' });

  // Para iframes: enviar comando CMD_SCROLL_TO_TOP
  const iframe = document.getElementById('moduleFrame');
  if (iframe && iframe.contentWindow) {
    try {
      iframe.contentWindow.postMessage({ type: 'CMD_SCROLL_TO_TOP' }, '*');
    } catch (e) {
      // Silenciar erros de cross-origin
    }
  }
}
</script>
